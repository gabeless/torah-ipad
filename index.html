<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Torah">
<meta name="theme-color" content="#f5f4ef">
<link rel="manifest" href="./manifest.json">
<title>Torah</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f5f4ef;
}

body {
  padding: 20px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

h1 {
  text-align: center;
  font-size: clamp(28px, 4vw, 44px);
  color: #263b32;
  margin: 5px 0 18px;
}

.grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
}

.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  border-radius: 25px;
  color: #183b5b;
  background: #dceafa;
  border: 2px solid rgba(0,0,0,.06);
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  text-align: center;
  padding: 12px;
  gap: 15px;
  -webkit-tap-highlight-color: transparent;
}

.tile:active {
  transform: scale(.97);
}

.tile.app {
  background: #e3efdf;
  color: #285532;
}

.logo {
  width: clamp(100px, 15vw, 180px);
  height: clamp(100px, 15vw, 180px);
  object-fit: contain;
  display: block;
}

.name {
  font-size: clamp(20px, 3vw, 34px);
  font-weight: bold;
}

</style>
</head>

<body>

<h1>תורה</h1>

<div class="grid">

<a class="tile" href="webapp://www.kolhalashon.com/en/regularSite/home">
  <img class="logo" src="./icons/kol-halashon.png" alt="Kol Halashon">
  <div class="name">Kol Halashon</div>
</a>

<a class="tile" href="webapp://irgunshiuraitorah.com/">
  <img class="logo" src="./icons/irgun-shiurei-torah.png" alt="Irgun Shiurei Torah">
  <div class="name">Irgun Shiurei Torah</div>
</a>

<a class="tile app" href="shortcuts://run-shortcut?name=Launch%20All%20Daf">
  <img class="logo" src="./icons/all-daf.png" alt="All Daf">
  <div class="name">All Daf</div>
</a>

<a class="tile app" href="shortcuts://run-shortcut?name=Launch%20Torah%20Anytime">
  <img class="logo" src="./icons/torah-anytime.png" alt="Torah Anytime">
  <div class="name">Torah Anytime</div>
</a>

</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>

</body>
</html>
